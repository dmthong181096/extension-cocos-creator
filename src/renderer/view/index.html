<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Skeleton Viewer 3.7.3</title>
</head>

<body>
    <div ref="app" id="app" style="opacity: 0;">
        <!-- Main Canvas Area -->
        <main class="main-canvas">
            <div class="canvas-container">
                <canvas ref="canvas"></canvas>
            </div>
            
            <!-- Event Notifications - Disabled -->
            <!-- <div class="event-notifications">
                <transition-group name="event-fly">
                    <div v-for="event in activeEvents" :key="event.id" class="event-notification">
                        <span>{{ event.name }}</span>
                    </div>
                </transition-group>
            </div> -->

            <!-- Playback Control Bar -->
            <div class="playback-control-bar">
                <button class="playback-btn" title="Restart" @click="restartAnimation">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                <button class="playback-btn play-pause-btn" :title="isPlaying ? 'Pause' : 'Play'" @click="togglePlayPause">
                    <svg v-if="isPlaying" class="icon" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
                    </svg>
                    <svg v-else class="icon" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M8 5v14l11-7z"/>
                    </svg>
                </button>
                <button class="playback-btn" title="Skip to End" @click="skipToEnd">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M16 18h2V6h-2v12zM6 18l8.5-6L6 6v12z"/>
                    </svg>
                </button>
                <div class="timeline-container">
                    <span class="time-text">{{ currentTime.toFixed(2) }}</span>
                    <input 
                        type="range" 
                        class="timeline-slider" 
                        :min="0" 
                        :max="duration || 1" 
                        :value="currentTime" 
                        step="0.01"
                        @input="onTimelineChange"
                        @mousedown="onTimelineMouseDown"
                        @mouseup="onTimelineMouseUp"
                    />
                    <span class="time-text">{{ (duration || 0).toFixed(2) }}</span>
                </div>
            </div>

            <!-- Bottom Control Bar -->
            <div class="control-bar">
                <button :title="t('selectAssets')" @click="onSelectBtnClick">
                    <svg class="icon" viewBox="0 0 30 30">
                        <path fill="currentColor" d="M15 30c-8.284 0-15-6.716-15-15s6.716-15 15-15v0c8.284 0 15 6.716 15 15s-6.716 15-15 15v0zM11.82 11.82l-5.31 11.67 11.67-5.31 5.31-11.67-11.67 5.31zM15 16.5c-0.828 0-1.5-0.672-1.5-1.5s0.672-1.5 1.5-1.5v0c0.828 0 1.5 0.672 1.5 1.5s-0.672 1.5-1.5 1.5v0z"></path>
                    </svg>
                </button>
                <button :title="t('reset')" @click="onResetBtnClick">
                    <svg class="icon" viewBox="0 0 30 30">
                        <path fill="currentColor" d="M4.395 25.605c-2.825-2.731-4.579-6.556-4.579-10.789 0-8.284 6.716-15 15-15 4.234 0 8.058 1.754 10.785 4.575l0.004 0.004c2.605 2.695 4.211 6.37 4.211 10.421 0 8.284-6.716 15-15 15-4.050 0-7.726-1.605-10.425-4.215l0.004 0.004zM17.1 15l4.245-4.245-2.115-2.115-4.23 4.245-4.245-4.245-2.115 2.115 4.245 4.245-4.245 4.245 2.115 2.115 4.245-4.245 4.245 4.245 2.115-2.115-4.245-4.245z"></path>
                    </svg>
                </button>
                <button :title="assetsInfo" @click="onInfoBtnClick">
                    <svg class="icon" viewBox="0 0 30 30">
                        <path fill="currentColor" d="M4.395 25.605c-2.825-2.731-4.579-6.556-4.579-10.789 0-8.284 6.716-15 15-15 4.234 0 8.058 1.754 10.785 4.575l0.004 0.004c2.605 2.695 4.211 6.37 4.211 10.421 0 8.284-6.716 15-15 15-4.050 0-7.726-1.605-10.425-4.215l0.004 0.004zM13.5 16.5v6h3v-9h-3v3zM13.5 7.5v3h3v-3h-3z"></path>
                    </svg>
                </button>
                <button :title="t('reposition')" @click="onRepositionBtnClick">
                    <svg class="icon" viewBox="0 0 30 30">
                        <path fill="currentColor" d="M15 30s-10.5-13.695-10.5-19.5c0-5.799 4.701-10.5 10.5-10.5s10.5 4.701 10.5 10.5v0c0 5.805-10.5 19.5-10.5 19.5zM15 13.5c1.657 0 3-1.343 3-3s-1.343-3-3-3v0c-1.657 0-3 1.343-3 3s1.343 3 3 3v0z"></path>
                    </svg>
                </button>
                <label :title="t('canvasColor')">
                    <input type="color" v-model="canvasColor" />
                </label>
                <span class="info-text" :title="offset">{{ offset }}</span>
                <span class="info-text" :title="t('spineRuntime') + ': ' + version">v{{ version }}</span>
            </div>
        </main>

        <!-- Properties Sidebar -->
        <aside ref="properties" class="properties-sidebar">
            <header class="properties-header">
                <h1>Skeleton Viewer</h1>
                <p>v3.7.3 Properties Panel</p>
            </header>
            
            <div class="properties-content">
                <!-- View Options -->
                <details class="property-section" open>
                    <summary class="section-header">
                        <h2>View Options</h2>
                        <span class="arrow">▼</span>
                    </summary>
                    <div class="section-content">
                        <div class="property-item">
                            <label for="scale">{{ t('viewScale') }}</label>
                            <input id="scale" type="number" step="0.1" v-model="viewScale" />
                        </div>
                        <div class="property-item">
                            <label for="draw-bones">{{ t('drawBones') }}</label>
                            <input id="draw-bones" type="checkbox" v-model="drawBones" />
                        </div>
                        <div class="property-item">
                            <label for="draw-bounding-boxes">{{ t('drawBoundingBoxes') }}</label>
                            <input id="draw-bounding-boxes" type="checkbox" v-model="drawBoundingBoxes" />
                        </div>
                        <div class="property-item">
                            <label for="draw-mesh-triangles">{{ t('drawMeshTriangles') }}</label>
                            <input id="draw-mesh-triangles" type="checkbox" v-model="drawMeshTriangles" />
                        </div>
                    </div>
                </details>

                <!-- Animation Controls -->
                <details class="property-section" open>
                    <summary class="section-header">
                        <h2>Animation Controls</h2>
                        <span class="arrow">▼</span>
                    </summary>
                    <div class="section-content">
                        <div class="property-item column">
                            <label for="animation">{{ t('animation') }}</label>
                            <select id="animation" v-model="animation">
                                <option v-for="name in animations" :key="name" :value="name">{{ name }}</option>
                            </select>
                        </div>
                        <div class="property-item">
                            <label for="loop">{{ t('loop') }}</label>
                            <input id="loop" type="checkbox" v-model="loop" />
                        </div>
                        <div class="property-item">
                            <label for="time-scale">{{ t('timeScale') }}</label>
                            <input id="time-scale" type="number" step="0.1" v-model="timeScale" />
                        </div>
                        <div class="property-item">
                            <label>{{ t('Duration') }}</label>
                            <span class="value-display">{{ duration }}</span>
                        </div>
                        <div class="property-item column">
                            <label>{{ t('Total events of spine') }}</label>
                            <input type="text" v-model="events" readonly />
                        </div>
                        <div class="property-item column">
                            <label>{{ t('Event') }}</label>
                            <input type="text" v-model="currentEventName" readonly />
                        </div>
                        <div class="property-item column">
                            <label>{{ t('Event Time Appear') }}</label>
                            <input type="text" v-model="currentEventTime" readonly />
                        </div>
                    </div>
                </details>

                <!-- Skin & Texture -->
                <details class="property-section" open>
                    <summary class="section-header">
                        <h2>Skin & Texture</h2>
                        <span class="arrow">▼</span>
                    </summary>
                    <div class="section-content">
                        <div class="property-item column">
                            <label for="skin">{{ t('skin') }}</label>
                            <select id="skin" v-model="skin">
                                <option v-for="name in skins" :key="name" :value="name">{{ name }}</option>
                            </select>
                        </div>
                        <div class="property-item">
                            <label for="premultiplied-alpha">{{ t('premultipliedAlpha') }}</label>
                            <input id="premultiplied-alpha" type="checkbox" v-model="premultipliedAlpha" />
                        </div>
                    </div>
                </details>
            </div>
        </aside>
    </div>
</body>

</html>
